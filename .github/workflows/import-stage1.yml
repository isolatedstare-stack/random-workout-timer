name: Import Android Stage 1 source
on:
  push:
    branches: [main]
    paths:
      - 'stage1-source.tar.gz'
      - '.github/workflows/import-stage1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract Stage 1 source files
        run: |
          tar -xzf stage1-source.tar.gz
          test -f android-app/app/src/main/assets/model.js
          test -f android-app/app/src/main/java/com/randomworkout/timer/MainActivity.java
          node android-app/tests/model.test.js
      - name: Commit Stage 1 source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app README-STAGE1.md
          if ! git diff --cached --quiet; then
            git commit -m "Add Android Beta 3.0 Stage 1 session editor"
            git push origin HEAD:main
          fi
