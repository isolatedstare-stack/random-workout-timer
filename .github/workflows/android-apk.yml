name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/beta3.2-weighted-bpm, feature/beta3.3-configuration-ux, feature/beta3.4-random-bpm-progression]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test model and execution engine
        run: |
          node android-app/tests/model.test.js
          node android-app/tests/engine.test.js
          node android-app/tests/audio-integration.test.js
          node android-app/tests/ux.test.js
      - name: Require and validate persistent signing key
        env:
          RWT_SIGNING_KEYSTORE_B64: ${{ secrets.RWT_SIGNING_KEYSTORE_B64 }}
          RWT_KEYSTORE_PASSWORD: ${{ secrets.RWT_KEYSTORE_PASSWORD }}
          RWT_KEY_ALIAS: ${{ secrets.RWT_KEY_ALIAS }}
          RWT_KEY_PASSWORD: ${{ secrets.RWT_KEY_PASSWORD }}
        run: |
          for name in RWT_SIGNING_KEYSTORE_B64 RWT_KEYSTORE_PASSWORD RWT_KEY_ALIAS RWT_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$RWT_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rwt-signing.p12"
          chmod 600 "$RUNNER_TEMP/rwt-signing.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/rwt-signing.p12" \
            -storepass "$RWT_KEYSTORE_PASSWORD" -alias "$RWT_KEY_ALIAS" >/dev/null
          echo "RWT_KEYSTORE_PATH=$RUNNER_TEMP/rwt-signing.p12" >> "$GITHUB_ENV"
          echo "Persistent signing key validated."
      - name: Compile debug APK
        env:
          RWT_KEYSTORE_PASSWORD: ${{ secrets.RWT_KEYSTORE_PASSWORD }}
          RWT_KEY_ALIAS: ${{ secrets.RWT_KEY_ALIAS }}
          RWT_KEY_PASSWORD: ${{ secrets.RWT_KEY_PASSWORD }}
        run: gradle -p android-app :app:assembleDebug --no-daemon
      - name: Verify APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK
        uses: actions/upload-artifact@v4
        with:
          name: random-workout-timer-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
