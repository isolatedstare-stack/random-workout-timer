<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1524"><title>Random Workout Timer · Beta 3</title>
<style>
:root{font-family:system-ui,-apple-system,Roboto,sans-serif;color-scheme:dark;--bg:#0c1524;--panel:#172337;--panel2:#1d2d45;--border:#34445d;--text:#f4f7fb;--muted:#aab9cf;--blue:#70b2ff;--red:#ffadb0;--green:#9fe6bd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:780px;margin:auto;padding:22px 16px 72px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}h1{font-size:1.35rem;line-height:1.3;margin:0}h2{font-size:1.18rem;margin:0 0 12px}h3{font-size:1.01rem;margin:0}p{line-height:1.5}.muted{color:var(--muted)}.small{font-size:.85rem}.eyebrow{letter-spacing:.08em;text-transform:uppercase;font-size:.69rem;color:#94b5df;font-weight:750}.tag{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:4px 9px;color:var(--muted);font-size:.75rem}.panel{background:var(--panel);border:1px solid var(--border);padding:18px;border-radius:17px;margin:16px 0}.card{background:var(--panel2);border:1px solid var(--border);border-radius:13px;padding:14px;margin:10px 0}.card-title{font-weight:750;font-size:1.03rem;overflow-wrap:anywhere}.card-meta{font-size:.82rem;color:var(--muted);margin-top:5px}.pill{background:#173c36;color:var(--green);font-size:.73rem;padding:4px 9px;border-radius:99px}.pill.warn{background:#4a322d;color:#ffd4b5}.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}.row.top{align-items:flex-start}.flex{flex:1;min-width:0}.stack{display:grid;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:block;margin:14px 0}.field>span{display:block;color:#ced8e8;font-size:.86rem;font-weight:650;margin-bottom:6px}.hint{font-size:.78rem;color:var(--muted);margin-top:5px;line-height:1.45}input:not([type=file]):not([type=checkbox]),select{display:block;width:100%;font:inherit;border:1px solid #56677d;border-radius:10px;color:var(--text);background:#101b2c;padding:12px;min-height:46px}input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue)}button{font:inherit;font-size:.91rem;font-weight:700;border:0;border-radius:10px;padding:11px 13px;background:var(--blue);color:#06172d;cursor:pointer;min-height:42px}button.secondary{background:#364a64;color:#edf4ff}button.ghost{background:transparent;border:1px solid #596981;color:#e4edfc}button.danger{background:#4a2b39;color:#ffced4}button.icon{padding:7px 11px;min-height:35px;white-space:nowrap}button:disabled{opacity:.38;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c1deff;outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.actions button{font-size:.82rem;padding:9px 11px;min-height:36px}.topnote{border-left:3px solid var(--blue);padding:10px 13px;background:#182e45;color:#c3d3e9;border-radius:0 8px 8px 0;font-size:.86rem;line-height:1.5}.notice{margin:12px 0;padding:12px;border-radius:10px;background:#1e3349;color:#c5e5ff}.notice.error{background:#462a35;color:#ffd6df}.notice.ok{background:#173d35;color:#bdf7d3}.issue{font-size:.83rem;background:#3a2a2c;border:1px solid #694448;color:#ffcebc;padding:9px 11px;border-radius:9px;margin-top:8px}.subtle{border-top:1px solid var(--border);margin:20px 0}.toggle{display:flex;align-items:center;gap:9px;margin-top:14px}.empty{text-align:center;padding:25px 12px;color:var(--muted)}.footer{font-size:.79rem;color:#90a1ba;margin-top:18px}.back{margin:0 0 16px}.exclusive{border:1px solid #566583;background:#20324e;border-radius:11px;padding:12px;margin:14px 0}#toast{display:none;position:sticky;bottom:12px;background:#233f5b;border:1px solid #7793ad;border-radius:12px;padding:12px;margin:12px 0;box-shadow:0 8px 28px #0006;z-index:10}#toast.show{display:block}#toast.bad{background:#542c35;border-color:#ab626f}@media(max-width:420px){.grid{grid-template-columns:1fr}main{padding:18px 13px 50px}.panel{padding:14px}.card{padding:12px}button{font-size:.85rem}}
.current-action{font-size:clamp(1.8rem,6vw,2.9rem);font-weight:850;margin:28px 0;overflow-wrap:anywhere}.time-grid{display:grid;gap:12px;margin:22px 0}.time-grid>div{background:#14223a;padding:12px;border-radius:10px}.time-grid strong{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums;margin-top:5px}
/* Beta 3.3 configuration flow: hierarchy and compact contextual operations */
.breadcrumbs{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:10px 0 18px;font-size:.89rem;line-height:1.5}
.breadcrumbs .crumb{border:0;background:transparent;color:var(--blue);padding:7px 3px;min-height:36px;font-weight:600}
.breadcrumbs strong{font-weight:750;color:var(--text);overflow-wrap:anywhere}
.crumb-sep{color:var(--muted);padding:0 2px}
.card-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.card-controls>button{font-size:.84rem}
.card-menu{min-width:0}
.card-menu>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 13px;border-radius:10px;border:1px solid #5b6f89;color:var(--text);font-weight:650;font-size:.83rem}
.card-menu>summary::-webkit-details-marker{display:none}
.card-menu>summary::after{content:" ▾";margin-left:6px}
.card-menu[open]>summary{background:#364a64}
.menu-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:10px;background:#14223a;border:1px solid var(--border);border-radius:10px}
.menu-actions button{font-size:.83rem}
.card-menu>summary:focus-visible{outline:3px solid #c1deff;outline-offset:2px}

/* Beta 3.3 clean navigation and touch sorting */
.minimal-header{align-items:center;margin:0 0 16px;min-height:50px}
.minimal-header h1{font-size:1.35rem}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app-menu{position:relative;margin-left:auto;z-index:30}
.app-menu>summary{list-style:none;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:12px;border:1px solid #526a84;background:var(--panel2);color:var(--text);font-size:1.5rem;cursor:pointer;user-select:none}
.app-menu>summary::-webkit-details-marker{display:none}
.app-menu[open]>summary{background:#364a64}
.app-menu-content{position:absolute;right:0;top:calc(100% + 8px);width:min(310px,calc(100vw - 32px));background:#1d2d45;border:1px solid #5b6f89;border-radius:13px;padding:10px;box-shadow:0 12px 35px #0009;display:grid;gap:6px}
.app-menu-content>button{width:100%;text-align:left;min-height:45px;background:transparent;color:var(--text);font-weight:600}
.app-menu-content>button:hover,.app-menu-content>button:focus-visible{background:#364a64}
.app-menu-content>p{color:var(--muted);font-size:.78rem;line-height:1.45;margin:8px 6px 3px}
.card-side{display:flex;align-items:center;gap:9px;flex-shrink:0}
.drag-handle{display:inline-flex;align-items:center;justify-content:center;width:44px;min-width:44px;height:44px;padding:0;border:1px solid #526a84;border-radius:9px;background:#30425d;color:#d8e6fa;font-size:1.6rem;line-height:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.drag-handle:active,.drag-handle[aria-grabbed=true]{cursor:grabbing;background:#4a6685}
.sortable-card.dragging{opacity:.63;border-color:var(--blue)}
.sortable-card.drop-before{border-top:3px solid var(--blue)}
.sortable-card.drop-after{border-bottom:3px solid var(--blue)}

/* Beta 3.3 compact settings organization */
.settings-panel h2{margin:0 0 14px}
.settings-panel h3{font-size:.9rem;font-weight:700;color:#dce7f8;margin:14px 0 6px}
.settings-panel .field{margin:11px 0}
.settings-panel .toggle{margin:14px 0}
.settings-divider{height:1px;background:var(--border);margin:18px 0}
.settings-panel .actions{margin-top:8px}
</style></head><body><main>
<header class="minimal-header"><h1>Workout sessions</h1>
<details class="app-menu" id="appMenu"><summary aria-label="Open app menu" title="Menu">☰</summary>
<div class="app-menu-content" role="group" aria-label="App tools">
<button data-do="export">Export sessions (JSON)</button>
<button data-do="import">Import sessions (JSON)</button>
<button data-do="test-end">Preview completion chime</button>
<p>Sessions save automatically on your device. Importing replaces the current sessions after confirmation.</p>
</div></details></header>
<span id="saveStatus" class="sr-only" aria-live="polite">Saved locally</span>
<div id="app"></div><div id="toast" role="status"></div>
<input id="importFile" type="file" accept="application/json,.json" style="display:none" aria-label="Select JSON backup">

</main><script src="model.js"></script><script src="engine.js"></script><script src="ux.js"></script><script src="app.js"></script></body></html>
