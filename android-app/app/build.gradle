plugins {
    id 'com.android.application'
}

// A stable private key can be supplied by GitHub Actions using repository secrets.
// Without it, Gradle falls back to an ephemeral debug key (testing only).
def privateKeystorePath = System.getenv('RWT_KEYSTORE_PATH')
def privateKeystorePassword = System.getenv('RWT_KEYSTORE_PASSWORD')
def privateKeyAlias = System.getenv('RWT_KEY_ALIAS')
def privateKeyPassword = System.getenv('RWT_KEY_PASSWORD')
def hasPersistentSigning = privateKeystorePath && privateKeystorePassword && privateKeyAlias && privateKeyPassword
if (privateKeystorePath && !hasPersistentSigning) {
    throw new GradleException('Persistent signing key provided but signing passwords/alias are incomplete.')
}

android {
    namespace 'com.randomworkout.timer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.randomworkout.timer.stage31'
        minSdk 26
        targetSdk 35
        versionCode 61
        versionName '3.3.0'
    }

    signingConfigs {
        if (hasPersistentSigning) {
            persistent {
                storeFile file(privateKeystorePath)
                storePassword privateKeystorePassword
                keyAlias privateKeyAlias
                keyPassword privateKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            if (hasPersistentSigning) signingConfig signingConfigs.persistent
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
